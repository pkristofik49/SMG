<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Testy rozhraní</title></head><body>
<h1>Testy rozhraní</h1><pre id="results">RUNNING</pre>
<iframe id="preview" title="Testovaná herna" style="width:1440px;height:1100px;border:0" src="../index.html"></iframe>
<script>
  'use strict';
  const frame = document.getElementById('preview');
  const lines = [];
  const pause = (duration = 60) => new Promise(resolve => setTimeout(resolve, duration));
  let failures = 0;
  function check(name, condition) { lines.push(`${condition ? 'PASS' : 'FAIL'} ${name}`); if (!condition) failures++; }
  async function reload() {
    await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); frame.contentWindow.location.reload(); });
    await pause();
  }
  frame.addEventListener('load', async () => {
    const win = frame.contentWindow;
    const keys = ['little-arcade.2048.v1', 'little-arcade.2048.best', 'little-arcade.language', 'little-arcade.palette', 'little-arcade.views', 'little-arcade.sound', 'little-arcade.2048-extended.v1', 'little-arcade.2048-extended.best', 'little-arcade.sudoku.v1', 'little-arcade.sudoku.completed', 'little-arcade.sudoku.best-times'];
    const legacyKeys = ['mala-herna.2048.v1', 'mala-herna.2048.best', 'mala-herna.language'];
    const speedyKeys = ['little-arcade.2048-speedy.v1', 'little-arcade.2048-speedy.best'];
    let originals;
    let legacyOriginals;
    let speedyOriginals;
    const originalAudioContext = win.AudioContext;
    try {
      await pause();
      originals = keys.map(key => win.localStorage.getItem(key));
      win.localStorage.removeItem(keys[4]); win.localStorage.removeItem(keys[5]);
      legacyOriginals = legacyKeys.map(key => win.localStorage.getItem(key));
      speedyOriginals = speedyKeys.map(key => win.localStorage.getItem(key));
      let doc = frame.contentDocument;
      doc.querySelector('[data-language="cs"]').click(); await pause();
      check('Vue renders the menu', !!doc.querySelector('.game-card') && !doc.querySelector('[v-cloak]'));
      for (const width of [320, 390, 768, 1440]) {
        frame.style.width = `${width}px`; await pause();
        check(`Menu has no horizontal overflow at ${width}px`, doc.documentElement.scrollWidth <= win.innerWidth);
      }
      const seeded = { board: [2, 2, ...Array(14).fill(0)], score: 0, moves: 0, won: false, continued: false, previous: null };
      win.localStorage.setItem(keys[0], JSON.stringify(seeded));
      await reload(); doc = frame.contentDocument;
      doc.querySelector('.game-card').click(); await pause();
      check('Menu opens the game without page navigation', !!doc.querySelector('.board') && win.location.hash === '#/2048');
      check('Game renders sixteen cells', doc.querySelectorAll('.tile').length === 16);
      for (const width of [320, 390, 768, 1440]) {
        frame.style.width = `${width}px`; await pause();
        check(`Game has no horizontal overflow at ${width}px`, doc.documentElement.scrollWidth <= win.innerWidth);
      }
      const board = doc.querySelector('.board');
      board.focus(); board.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true, cancelable: true }));
      await pause();
      let saved = JSON.parse(win.localStorage.getItem(keys[0]));
      check('Keyboard merges once and records one move', saved.score === 4 && saved.moves === 1 && saved.board[0] === 4);
      const reducedMotion = win.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reducedMotion) {
        const moving = Array.from(doc.querySelectorAll('.moving-tile'));
        check('Both original tiles remain visible while merging', moving.length === 2 && moving.every(tile => tile.textContent.trim() === '2'));
        const animation = moving[1]?.getAnimations()[0];
        const frames = animation?.effect.getKeyframes();
        check('Tile travels to the neighbouring cell', !!frames && frames[0].transform === 'translate(0px, 0px)' && /^translate\(-[\d.]+px, 0px\)$/.test(frames[1].transform));
        check('Final values are hidden during movement', doc.querySelector('.board').classList.contains('board-animating') && win.getComputedStyle(doc.querySelector('.board .tile span')).visibility === 'hidden');
      } else check('Reduced motion skips tile travel', !doc.querySelector('.tile-motion-layer'));
      await pause(130);
      check('Movement finishes with one merged tile and one new tile', !doc.querySelector('.tile-motion-layer') && doc.querySelectorAll('.tile-merged').length === 1 && doc.querySelectorAll('.tile-new').length === 1);
      check('Merged tile shows the sum at its destination', doc.querySelector('.tile-merged')?.textContent.trim() === '4');
      doc.querySelector('.undo-button').click(); await pause();
      saved = JSON.parse(win.localStorage.getItem(keys[0]));
      check('Undo restores the complete previous board and score', saved.score === 0 && saved.moves === 0 && JSON.stringify(saved.board) === JSON.stringify(seeded.board));
      check('Undo is available once', doc.querySelector('.undo-button').disabled);
      doc.querySelector('.direction-pad button').click(); await pause();
      check('Direction buttons work', JSON.parse(win.localStorage.getItem(keys[0])).moves === 1);
      doc.querySelector('.new-game-button').click(); await pause();
      check('Restart requires confirmation', !!doc.querySelector('[role="dialog"]') && doc.activeElement === doc.querySelector('.primary-button'));
      await pause(200);
      check('Finishing an interrupted animation cannot dismiss the restart dialog', !!doc.querySelector('[role="dialog"]') && !doc.querySelector('.tile-motion-layer'));
      doc.querySelector('.board-overlay .text-button').click(); await pause();
      check('Cancelling preserves the game', !doc.querySelector('[role="dialog"]') && JSON.parse(win.localStorage.getItem(keys[0])).moves === 1);
      const beforeReload = JSON.stringify(JSON.parse(win.localStorage.getItem(keys[0])).board);
      await reload(); doc = frame.contentDocument;
      check('Reload restores the game', JSON.stringify(Array.from(doc.querySelectorAll('.tile')).map(tile => Number(tile.textContent.trim()))) === beforeReload);
      const full = [2,4,2,4,4,2,4,2,2,4,2,4,4,2,4,2];
      win.localStorage.setItem(keys[0], JSON.stringify({ ...seeded, board: full, moves: 10 }));
      await reload(); doc = frame.contentDocument;
      check('Blocked game shows end dialog', doc.querySelector('[role="dialog"] h2')?.textContent.includes('není kam'));
      win.localStorage.setItem(keys[0], JSON.stringify({ ...seeded, board: [2048,2,...Array(14).fill(0)], won: true, moves: 100 }));
      await reload(); doc = frame.contentDocument;
      check('2048 shows win dialog', doc.querySelector('[role="dialog"] h2')?.textContent.includes('2048'));
      doc.querySelector('.primary-button').click(); await pause();
      check('Player can continue after winning', !doc.querySelector('[role="dialog"]') && JSON.parse(win.localStorage.getItem(keys[0])).continued);
      win.localStorage.setItem(keys[0], JSON.stringify(seeded));
      await reload(); doc = frame.contentDocument;
      // Keep spawning deterministic while exercising the animation input queue.
      win.Math.random = () => 0;
      const buttons = doc.querySelectorAll('.direction-pad button');
      buttons[0].click(); buttons[2].click();
      await pause(400);
      saved = JSON.parse(win.localStorage.getItem(keys[0]));
      const expected = Array(16).fill(0); expected[0] = 2; expected[12] = 4; expected[13] = 2;
      check('Rapid inputs execute in order after the slide finishes', saved.moves === 2 && JSON.stringify(saved.board) === JSON.stringify(expected) && !doc.querySelector('.tile-motion-layer'));
      buttons[1].click(); await pause(30);
      doc.querySelector('.undo-button').click(); await pause(220);
      saved = JSON.parse(win.localStorage.getItem(keys[0]));
      check('Undo during animation cancels stale visual work', saved.moves === 2 && JSON.stringify(saved.board) === JSON.stringify(expected) && !doc.querySelector('.tile-motion-layer'));

      doc.querySelector('.back-link').click(); await pause(220);

      doc.querySelector('.new-game-button').click(); await pause();

      doc.querySelector('.board-overlay .text-button').click(); await pause();
      check('Cancelling new game keeps the saved game', !doc.querySelector('[role="dialog"]') && win.localStorage.getItem(keys[0]) === beforeNewGame);
      doc.querySelector('.new-game-button').click(); await pause();
      doc.querySelector('.primary-button').click(); await pause();

      const beforeLanguageChange = win.localStorage.getItem(keys[0]);
      doc.querySelector('.back-link').click(); await pause();
      doc.querySelector('[data-language="en"]').click(); await pause();

      check('Language switch preserves the saved game and best score', win.localStorage.getItem(keys[0]) === beforeLanguageChange && win.localStorage.getItem(keys[1]) === bestBeforeNewGame);
      const dictionary = win.ArcadeTranslations;
      check('Both dictionaries cover the same messages and placeholders', JSON.stringify(Object.keys(dictionary.cs).sort()) === JSON.stringify(Object.keys(dictionary.en).sort()) && Object.keys(dictionary.cs).every(key =>
        JSON.stringify((dictionary.cs[key].match(/\{\w+\}/g) || []).sort()) === JSON.stringify((dictionary.en[key].match(/\{\w+\}/g) || []).sort())));
      for (const width of [320, 390, 768, 1440]) {
        frame.style.width = `${width}px`; await pause();
        check(`English menu has no horizontal overflow at ${width}px`, doc.documentElement.scrollWidth <= win.innerWidth);
      }
      await reload(); doc = frame.contentDocument;
      check('English choice persists across reloads', doc.documentElement.lang === 'en' && doc.querySelector('[data-language="en"]').getAttribute('aria-pressed') === 'true');
      doc.querySelector('.game-card').click(); await pause();
      check('English translates game controls and accessibility labels', doc.querySelector('.new-game-button').getAttribute('aria-label').includes('New game') && doc.querySelector('.board').getAttribute('aria-label').includes('Use the arrow keys') && doc.querySelector('.board .tile').getAttribute('aria-label').startsWith('Row 1, column 1:'));
      for (const width of [320, 390, 768, 1440]) {
        frame.style.width = `${width}px`; await pause();
        check(`English game has no horizontal overflow at ${width}px`, doc.documentElement.scrollWidth <= win.innerWidth);
      }
      check('English plural for zero moves', doc.querySelector('.below-board>span').textContent === '0 moves');
      doc.querySelector('.direction-pad button').click(); await pause(220);
      check('English singular and live announcement', doc.querySelector('.below-board>span').textContent === '1 move' && doc.querySelector('[aria-live]').textContent.includes('Move 1. Score'));
      doc.querySelectorAll('.direction-pad button')[2].click(); await pause(220);
      check('English plural for multiple moves', doc.querySelector('.below-board>span').textContent === '2 moves');
      doc.querySelector('.new-game-button').click(); await pause();
      check('English restart dialog and buttons', doc.querySelector('[role="dialog"] h2').textContent === 'Start again?' && doc.querySelector('.primary-button').textContent === 'Start a new game');
      win.localStorage.setItem(keys[0], JSON.stringify({ ...seeded, board: full, moves: 10 }));
      await reload(); doc = frame.contentDocument;
      check('English game-over dialog', doc.querySelector('[role="dialog"] h2').textContent === 'No more moves this time.');
      win.localStorage.setItem(keys[0], JSON.stringify({ ...seeded, board: [2048,2,...Array(14).fill(0)], won: true, moves: 100 }));
      await reload(); doc = frame.contentDocument;
      check('English win dialog', doc.querySelector('[role="dialog"] h2').textContent === 'You reached 2048!' && doc.querySelector('.primary-button').textContent === 'Keep playing');
      doc.querySelector('.back-link').click(); await pause();
      doc.querySelector('[data-language="cs"]').click(); await pause();
      check('Switching back restores Czech', doc.documentElement.lang === 'cs' && doc.getElementById('menu-title').textContent.includes('Na chvíli vypnout.'));
      win.localStorage.setItem(keys[0], JSON.stringify({ ...seeded, score: 16384, moves: 4 }));
      await reload(); doc = frame.contentDocument;
      const csScore = doc.querySelector('.card-scores dd').textContent;
      doc.querySelector('[data-language="en"]').click(); await pause();
      check('Score formatting follows the selected language', csScore === new Intl.NumberFormat('cs-CZ').format(16384) && doc.querySelector('.card-scores dd').textContent === '16,384');
      win.localStorage.setItem(keys[2], 'unknown');
      await reload(); doc = frame.contentDocument;
      check('Unsupported language renders Czech', doc.documentElement.lang === 'cs' && !doc.querySelector('[v-cloak]'));
      doc.querySelector('.game-card').click(); await pause();
      check('Czech plural for four moves', doc.querySelector('.below-board>span').textContent === '4 tahy');
      win.localStorage.setItem(keys[0], JSON.stringify({ ...seeded, moves: 5 }));
      await reload(); doc = frame.contentDocument;
      check('Czech plural for five moves', doc.querySelector('.below-board>span').textContent === '5 tahů');
      let audioContexts = 0;
      const tones = [];
      const parameter = () => ({ setValueAtTime() {}, linearRampToValueAtTime() {}, exponentialRampToValueAtTime() {}, cancelScheduledValues() {}, setTargetAtTime() {} });
      // Exercise the real sound controller and UI without playing sound during tests.
      win.AudioContext = class {
        constructor() { audioContexts++; this.state = 'running'; this.currentTime = 0; this.destination = {}; }
        createGain() { return { gain: parameter(), connect() {}, disconnect() {} }; }
        get sampleRate() { return 48000; }
        createBuffer(channels, length) { return { getChannelData: () => new Float32Array(length) }; }
        createBiquadFilter() { return { Q: parameter(), frequency: parameter(), connect() {}, disconnect() {} }; }
        createBufferSource() {
          return { type: 'noise', stops: [], connect() {}, disconnect() {}, start() { tones.push(this); }, stop(time) { this.stops.push(time); } };
        }
        createOscillator() {
          const tone = { frequency: parameter(), stops: [], connect() {}, disconnect() {}, start() { tones.push(this); }, stop(time) { this.stops.push(time); } };
          return tone;
        }
        resume() { this.state = 'running'; return Promise.resolve(); }
        close() { this.state = 'closed'; return Promise.resolve(); }
      };
      const testAudioContext = win.AudioContext;
      const soundButton = doc.querySelector('.sound-button');
      check('Sound is off by default and no audio context is created', soundButton.getAttribute('aria-pressed') === 'false' && soundButton.textContent === 'Zvuk: ne' && audioContexts === 0);
      doc.querySelector('.direction-pad button').click(); await pause(220);
      check('Muted moves and merges never create audio', tones.length === 0 && audioContexts === 0);
      doc.querySelector('.undo-button').click(); await pause();
      const gameBeforeSound = win.localStorage.getItem(keys[0]);
      soundButton.click(); await pause();
      check('Opting in enables sound without changing the game', soundButton.getAttribute('aria-pressed') === 'true' && soundButton.textContent === 'Zvuk: ano' && audioContexts === 1 && win.localStorage.getItem(keys[0]) === gameBeforeSound);
      doc.querySelector('.direction-pad button').click(); await pause(30);
      check('A valid move starts one sliding noise sound', tones.length === 1 && tones[0].type === 'noise');
      await pause(200);
      check('Merge adds a two-note effect after landing', tones.length === 3);
      soundButton.click(); await pause();
      check('Muting stops active and scheduled notes', soundButton.getAttribute('aria-pressed') === 'false' && tones.every(tone => tone.stops.includes(0.025)));
      doc.querySelector('.undo-button').click(); await pause();
      doc.querySelector('.direction-pad button').click(); await pause(220);
      check('Moves stay silent after muting', tones.length === 3);
      win.AudioContext = originalAudioContext;
      await reload(); doc = frame.contentDocument;
      check('Reload preserves the muted sound setting', doc.querySelector('.sound-button').getAttribute('aria-pressed') === 'false');
      const legacyGame = JSON.stringify({ ...seeded, score: 128, moves: 7 });
      keys.forEach(key => win.localStorage.removeItem(key));
      win.localStorage.setItem(legacyKeys[0], legacyGame);
      win.localStorage.setItem(legacyKeys[1], '8192');
      win.localStorage.setItem(legacyKeys[2], 'en');
      await reload(); doc = frame.contentDocument;
      check('Storage migration restores the existing game without losing progress', win.localStorage.getItem(keys[0]) === legacyGame && doc.querySelector('.below-board>span').textContent === '7 moves' && doc.querySelector('.scores strong').textContent === '128');
      check('Storage migration preserves the record and language', win.localStorage.getItem(keys[1]) === '8192' && win.localStorage.getItem(keys[2]) === 'en' && doc.documentElement.lang === 'en');
      check('Storage migration retains the original data as a fallback', win.localStorage.getItem(legacyKeys[0]) === legacyGame);
      const newerGame = JSON.stringify({ ...seeded, score: 256, moves: 8 });
      win.localStorage.setItem(keys[0], newerGame);
      win.localStorage.setItem(keys[1], '16384');
      win.localStorage.setItem(keys[2], 'cs');
      await reload(); doc = frame.contentDocument;
      check('New storage values take precedence over historical data', win.localStorage.getItem(keys[0]) === newerGame && doc.querySelector('.scores strong').textContent === '256' && doc.documentElement.lang === 'cs' && win.localStorage.getItem(keys[1]) === '16384');
      function sendKey(key, options = {}) {
        const event = new win.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...options });
        (doc.activeElement || doc.body).dispatchEvent(event);
        return event;
      }
      win.AudioContext = testAudioContext;
      const keyboardSound = doc.querySelector('.sound-button');
      keyboardSound.focus();
      sendKey('z'); await pause();
      check('Z enables sound even when a button has focus', keyboardSound.getAttribute('aria-pressed') === 'true');
      sendKey('z', { repeat: true }); await pause();
      check('Holding Z does not repeatedly toggle sound', keyboardSound.getAttribute('aria-pressed') === 'true');
      sendKey('z'); await pause();
      check('A second Z disables sound', keyboardSound.getAttribute('aria-pressed') === 'false');
      const beforeKeyboardRestart = win.localStorage.getItem(keys[0]);
      doc.querySelector('.new-game-button').focus();
      sendKey('n'); await pause();
      check('N opens restart confirmation without changing the game', doc.querySelector('[role="dialog"] h2')?.textContent === 'Začít znovu?' && win.localStorage.getItem(keys[0]) === beforeKeyboardRestart);
      sendKey('n', { repeat: true }); await pause();
      check('Holding N cannot confirm the restart', !!doc.querySelector('[role="dialog"]') && win.localStorage.getItem(keys[0]) === beforeKeyboardRestart);
      const backspaceEvent = sendKey('Backspace'); await pause();
      check('Backspace cancels restart and restores board focus', backspaceEvent.defaultPrevented && !doc.querySelector('[role="dialog"]') && doc.activeElement === doc.querySelector('.board') && win.localStorage.getItem(keys[0]) === beforeKeyboardRestart);
      sendKey('n'); await pause();
      sendKey('Enter'); await pause();
      saved = JSON.parse(win.localStorage.getItem(keys[0]));
      check('Enter confirms the pending new game and preserves the record', !doc.querySelector('[role="dialog"]') && saved.moves === 0 && saved.score === 0 && win.localStorage.getItem(keys[1]) === '16384');
      win.localStorage.setItem(keys[0], newerGame);
      win.AudioContext = originalAudioContext;
      await reload(); doc = frame.contentDocument;
      sendKey('n'); await pause();
      sendKey('n'); await pause();
      saved = JSON.parse(win.localStorage.getItem(keys[0]));
      check('A separate second N confirms the new game', !doc.querySelector('[role="dialog"]') && saved.moves === 0 && saved.score === 0);
      const beforeIgnoredShortcuts = win.localStorage.getItem(keys[0]);
      const input = doc.createElement('input');
      doc.body.append(input); input.focus();
      const inputN = sendKey('n'), inputZ = sendKey('z'), inputBackspace = sendKey('Backspace');
      await pause();
      check('Shortcuts leave text inputs and editing keys alone', !inputN.defaultPrevented && !inputZ.defaultPrevented && !inputBackspace.defaultPrevented && !doc.querySelector('[role="dialog"]') && win.localStorage.getItem(keys[0]) === beforeIgnoredShortcuts);

      sendKey('n', { ctrlKey: true }); sendKey('n', { isComposing: true }); await pause();
      check('Shortcuts ignore modifiers and text composition', !doc.querySelector('[role="dialog"]') && win.localStorage.getItem(keys[0]) === beforeIgnoredShortcuts);
      doc.querySelector('.back-link').click(); await pause();
      sendKey('n'); sendKey('z'); await pause();
      check('New-game shortcut leaves the menu alone while Z remains global', !!doc.querySelector('.game-card') && !doc.querySelector('[role="dialog"]') && win.localStorage.getItem(keys[0]) === beforeIgnoredShortcuts && doc.querySelector('.sound-button').getAttribute('aria-pressed') === 'true');
      doc.querySelector('.sound-button').click(); await pause();
      const blockedGame = JSON.stringify({ ...seeded, board: [2, 4, 8, 16, ...Array(12).fill(0)], moves: 3 });

      check('Every supported language has all messages and matching placeholders', allTranslations.languages.every(({ code }) =>
        Object.keys(allTranslations.cs).every(key => Object.hasOwn(allTranslations[code], key) && JSON.stringify((allTranslations.cs[key].match(/\{\w+\}/g) || []).sort()) === JSON.stringify((allTranslations[code][key].match(/\{\w+\}/g) || []).sort()))));

        { code: 'de', heading: 'Kurz abschalten.', newGame: 'Neues Spiel', restart: 'Neu anfangen?', count: '3 Züge' },
